name: ImageConverterForWebP CI

on:
  push:
    branches-ignore:
      - release-*

permissions:
  contents: write

jobs:
  php74:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Set up PHP v7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          extensions: gd, imagick, mbstring, zip, intl

      - name: Install Composer
        run: composer install

      - name: Linting
        run: composer run lint

      - name: Testing
        run: composer run test

      - name: Static Analysis
        run: composer run analyse

  php80:
    runs-on: ubuntu-24.04

    needs: php74

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Set up PHP v8.0
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.0"
          extensions: gd, imagick, mbstring, zip, intl

      - name: Install Composer
        run: composer install

      - name: Linting
        run: composer run lint

      - name: Testing
        run: composer run test

      - name: Static Analysis
        run: composer run analyse

  php82:
    runs-on: ubuntu-24.04

    needs: php80

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Set up PHP v8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: gd, imagick, mbstring, zip, intl

      - name: Install Composer
        run: composer install

      - name: Linting
        run: composer run lint

      - name: Testing
        run: composer run test

      - name: Static Analysis
        run: composer run analyse
